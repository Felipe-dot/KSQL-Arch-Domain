version: '3.8'
services:
  kafka-connect:
    build: docker/cdc
    hostname: kafka-connect
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker:9092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "compose-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "docker-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "docker-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "docker-connect-status"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/etc/kafka-connect/jars,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_LICENSE_TOPIC_REPLICATION_FACTOR: "1"
    networks:
      - ksql_network
      - shared_network
    volumes:
      - ./connect-jars:/etc/kafka-connect/jars
    depends_on:
      - broker
      - zookeeper
      - ksqldb-server
      - ksqldb-cli
  kafka-ui:
    container_name: kafka-ui
    depends_on:
      - broker
      - zookeeper
      - ksqldb-server
      - ksqldb-cli
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: "push-na-master-ksql-arch-domain-cluster-01"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
      KAFKA_CLUSTERS_0_KSQLDBSERVER: "http://ksqldb-server:8088"
      KAFKA_CLUSTERS_0_KSQLDBUSERNAME: "admin"
      KAFKA_CLUSTERS_0_KSQLDBPASSWORD: "nimda"
    networks:
      - ksql_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    platform: linux/arm64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ksql_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  broker:
    image: confluentinc/cp-kafka:7.4.0
    hostname: broker
    container_name: broker
    platform: linux/arm64
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - ksql_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  ksqldb-server:
    build: docker/docker-customized
    hostname: ksqldb-server
    container_name: ksqldb-server
    platform: linux/arm64
    depends_on:
      - broker
      - zookeeper
    ports:
      - "8088:8088"
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: broker:9092
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_OPTS: "-Dauthentication.method=BASIC -Dauthentication.realm=KsqlServer-Props -Dauthentication.roles=admin,user -Djava.security.auth.login.config=/etc/ksqldb/jaas_config.file"
      KSQL_CLASSPATH: '/usr/share/java/jetty/jetty-jaas-9.4.24.v20191120.jar'
    volumes:
      - ./docker/docker-customized/security:/etc/ksqldb
      - ./docker/docker-customized/ksqldb-server.properties:/etc/ksqldb/ksql-server.properties
    networks:
      - ksql_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  ksqldb-cli:
    build: docker/docker-customized
    container_name: ksqldb-cli
    platform: linux/arm64
    depends_on:
      - broker
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true
    networks:
      - ksql_network

  kafka-exporter:
    image: docker.io/bitnami/kafka-exporter:latest
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    depends_on:
      - zookeeper
      - broker
      - ksqldb-server
      - kafka-ui
      - ksqldb-cli
    networks:
      - ksql_network
      - shared_network
    command:
      - --kafka.server=broker:9092
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9308; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  redis:
    image: redis:latest
    container_name: redis-push-na-master
    ports:
      - "6379:6379"
    command: ["redis-server","--requirepass","nimdapushnamaster","--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:management
    restart: always
    container_name: rabbit-mq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: nimda
    networks:
      - ksql_network

networks:
  ksql_network:
    driver: bridge
  shared_network:
    external: true
